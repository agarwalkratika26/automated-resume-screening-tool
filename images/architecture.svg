<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#f8fafc" rx="16" />

  <!-- Title Banner -->
  <rect x="24" y="24" width="852" height="60" rx="10" fill="url(#gradHeader)" filter="url(#shadow)" />
  <text x="450" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Automated Resume Screening Tool — System Architecture
  </text>

  <!-- Box 1: Ingestion Layer -->
  <rect x="40" y="120" width="160" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="120" width="160" height="40" rx="12" fill="#e2e8f0" />
  <text x="120" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">1. INGESTION</text>
  <text x="120" y="185" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">• TXT Resumes</text>
  <text x="120" y="215" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">• PDF Resumes</text>
  <text x="120" y="245" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">• DOCX Documents</text>
  <text x="120" y="280" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(resumes/sample/)</text>

  <!-- Arrow 1 to 2 -->
  <line x1="200" y1="220" x2="250" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Box 2: Extraction & Normalization -->
  <rect x="250" y="120" width="170" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <rect x="250" y="120" width="170" height="40" rx="12" fill="#dbeafe" />
  <text x="335" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">2. EXTRACTION</text>
  <text x="335" y="180" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">DocumentExtractor</text>
  <text x="335" y="210" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Regex Sanitization</text>
  <text x="335" y="240" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Experience Estimator</text>
  <text x="335" y="270" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Section Detector</text>

  <!-- Arrow 2 to 3 -->
  <line x1="420" y1="220" x2="470" y2="220" stroke="#94a3b8" stroke-width="2" />

  <!-- Box 3: Matching & Scoring Engine -->
  <rect x="470" y="120" width="180" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <rect x="470" y="120" width="180" height="40" rx="12" fill="#e0e7ff" />
  <text x="560" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">3. SCORING ENGINE</text>
  <text x="560" y="175" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Required Skills (40%)</text>
  <text x="560" y="205" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Preferred Skills (20%)</text>
  <text x="560" y="235" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">TF-IDF Cosine Similarity (25%)</text>
  <text x="560" y="265" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Experience Fit (15%)</text>
  <text x="560" y="295" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4338ca" text-anchor="middle">Skill Taxonomy Mapping</text>

  <!-- Arrow 3 to 4 -->
  <line x1="650" y1="220" x2="700" y2="220" stroke="#94a3b8" stroke-width="2" />

  <!-- Box 4: Serving & Presentation -->
  <rect x="700" y="120" width="160" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <rect x="700" y="120" width="160" height="40" rx="12" fill="#dcfce7" />
  <text x="780" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">4. PRESENTATION</text>
  <text x="780" y="180" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">FastAPI Endpoints</text>
  <text x="780" y="210" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Next.js Dashboard</text>
  <text x="780" y="240" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">JSON/CSV Reports</text>
  <text x="780" y="275" font-family="sans-serif" font-size="11" fill="#15803d" text-anchor="middle">(outputs/)</text>

  <!-- Bottom Fixtures Bar -->
  <rect x="150" y="360" width="600" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <text x="450" y="388" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">DATA FIXTURES &amp; VOCABULARY LAYER (data/)</text>
  <text x="450" y="412" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">job_descriptions.json (Preset JDs) • skills.json (Ontology &amp; Synonyms)</text>
</svg>
